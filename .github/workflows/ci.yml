name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # kern is pinned as GitHub source and the lockfile records it over SSH.
      # kern is public, so plain HTTPS reaches it with no key and no token.
      - name: Fetch GitHub dependencies over HTTPS
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # House style does not use an em dash. Ratcheted against a baseline, as in
      # kern: new ones fail, and existing ones can only come down.
      - name: Lint prose
        run: npm run lint:prose

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The unit suite renders in jsdom, which has no layout and no colour, so
      # contrast, focus visibility and the worker are only checked here, in a
      # real browser against the production build.
      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: End-to-end
        run: npm run e2e

      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # kern is pinned as GitHub source and the lockfile records it over SSH.
      # kern is public, so plain HTTPS reaches it with no key and no token.
      - name: Fetch GitHub dependencies over HTTPS
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build


      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gray-scott-hipuku --branch=main --commit-dirty=true

      # A green deploy is not evidence the site changed. This repo served a
      # nineteen-day-old build while CI, the deploy job and the URL were all
      # green: the custom domain sat on a second Pages project whose builds had
      # been failing since, and nothing compared the two. The entry hash is the
      # cheapest thing that can tell them apart, because Vite renames it on any
      # content change.
      - name: Verify the live site serves this build
        run: |
          BUILT=$(ls dist/assets | grep -E '^index-.*\.js$' | head -1)
          echo "built: $BUILT"
          for i in $(seq 1 10); do
            LIVE=$(curl -fsSL --max-time 20 "$SITE" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            echo "attempt $i, live: ${LIVE:-none}"
            [ "$LIVE" = "$BUILT" ] && echo "live site matches this build" && exit 0
            sleep 15
          done
          echo "::error::$SITE serves ${LIVE:-nothing}, expected $BUILT."
          echo "::error::The deploy reported success, so the domain is bound to a different Pages project."
          exit 1
        env:
          SITE: https://gray-scott.hipuku.dev
